<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Goals++ Home</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
    }
    #main {
      display: none; /* Prevent flash of content */
    }
    #loading {
      text-align: center;
      padding: 2rem;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <!-- Show while checking auth -->
  <div id="loading">Checking authentication...</div>

  <!-- Hidden content -->
  <div id="main">
    <nav>
      <div class="nav-links">
        <a href="index.html" class="active">Home</a>
        <a href="tasks.html">Tasks</a>
        <a href="pomodoro.html">Pomodoro</a>
      </div>
    </nav>
    <main>
      <h1>Welcome to Goals++</h1>
      <p>Track your tasks, manage your time, and boost productivity with a soothing interface.</p>
    </main>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA_ogA9sHin2gW9Wly-3COVawl1NOZSvdg",
      authDomain: "goals-tracker-e8028.firebaseapp.com",
      projectId: "goals-tracker-e8028"
    };

    // Avoid double initialization
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const auth = firebase.auth();
    auth.onAuthStateChanged(user => {
      if (user) {
        // Authenticated: show the main content
        document.getElementById("loading").style.display = "none";
        document.getElementById("main").style.display = "block";
      } else {
        // Not authenticated: redirect to login
        window.location.href = 'login.html';
      }
    });
  </script>
</body>
</html>
