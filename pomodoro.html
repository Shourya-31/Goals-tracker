<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pomodoro Mode</title>
  <link rel="stylesheet" href="pomodoro.css">
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="tasks.html">Tasks</a>
    <a href="#" class="active">Pomodoro</a>
  </nav>

  <main>
    h2>Pomodoro Session</h2>
<p id="sessionLabel">Work</p>
<div id="timer">25:00</div>
<button id="startBtn">Start</button>
<button id="pauseBtn">Pause</button>
<button id="resetBtn">Reset</button>

<div>
  <label>Work: <input id="workInput" type="number" value="25"> min</label>
  <label>Short Break: <input id="shortInput" type="number" value="5"> min</label>
  <label>Long Break: <input id="longInput" type="number" value="15"> min</label>
  <label>Long Break After: <input id="longBreakAfterInput" type="number" value="4"></label>
</div>

<div class="motivation">💪 Let’s focus and get it done!</div>
<div><strong>Pomodoros Completed:</strong> <span id="completedCount">0</span> 🍅</div>
  </main>

  <audio id="alertSound" src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" preload="auto"></audio>
  <script src="pomodoro.js"></script>
</body>
</html>
