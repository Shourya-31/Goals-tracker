<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pomodoro Mode</title>
  <link rel="stylesheet" href="pomodoro.css">
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="tasks.html">Tasks</a>
    <a href="#" class="active">Pomodoro</a>
  </nav>

  <main>
    <h1>Pomodoro Session</h1>

    <div class="session-type" id="sessionType">Work</div>
    <div id="timer">25:00</div>

    <div class="controls">
      <button id="startBtn">Start</button>
      <button id="pauseBtn">Pause</button>
      <button id="resetBtn">Reset</button>
    </div>

    <div class="custom-settings">
      <label>Work: <input type="number" id="workDuration" value="25"> min</label>
      <label>Short Break: <input type="number" id="shortBreak" value="5"> min</label>
      <label>Long Break: <input type="number" id="longBreak" value="15"> min</label>
      <label>Long Break After: <input type="number" id="cyclesBeforeLongBreak" value="4"></label>
    </div>

    <div class="quote" id="quote">💪 Let’s focus and get it done!</div>
    <div class="progress" id="progress">Pomodoros Completed: 0 🍅</div>
  </main>

  <audio id="alertSound" src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" preload="auto"></audio>
  <script src="pomodoro.js"></script>
</body>
</html>
