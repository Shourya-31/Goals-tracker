<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro Timer</title>
  <!-- Link to the CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h2>Pomodoro Session</h2>
    <div id="session-label">Work</div>

    <div class="timer-circle">
      <svg width="200" height="200">
        <!-- Background track -->
        <circle class="ring-track" cx="100" cy="100" r="90"></circle>
        <!-- Progress indicator -->
        <circle class="ring-progress" cx="100" cy="100" r="90"></circle>
      </svg>
      <div id="timer-display">25:00</div>
    </div>

    <div class="controls">
      <button id="startBtn">Start</button>
      <button id="pauseBtn">Pause</button>
      <button id="resetBtn">Reset</button>
    </div>

    <div class="settings">
      <label>Work: <input type="number" id="workDuration" value="25" min="1" /> m</label>
      <label>Short Break: <input type="number" id="shortBreak" value="5" min="1" /> m</label>
      <label>Long Break: <input type="number" id="longBreak" value="15" min="1" /> m</label>
      <label>Long After: <input type="number" id="longBreakAfter" value="4" min="1" /></label>
    </div>

    <div class="quote">💪 Let’s focus and get it done!</div>
    <div id="progress">Pomodoros Completed: 0 🍅</div>
  </main>

  <!-- Link to the JavaScript file (placed at the end) -->
  <script src="script.js"></script>
</body>
</html>
