<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YeolPumta+ Tasks</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <nav>…</nav>
  <div class="container">

    <section>
      <input type="text" id="newTask" placeholder="Enter a new task…" />
      <button id="addTaskBtn" class="btn-primary">Add Task</button>
    </section>
    <ul id="tasksList"></ul>
  </div>


  <div id="overlay" class="hidden">
    <div id="taskModal">
      <h3 id="modalTaskName"></h3>
      <div id="modalTimer">00:00</div>
      <button id="modalPause" class="btn-secondary">Pause</button>
      <button id="modalClose" class="btn-secondary">Close</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="tasks.js"></script>
</body>

</html>
