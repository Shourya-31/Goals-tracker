<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Goals++ Tasks</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
</head>
<body>
  <!-- at the very top of <body> in tasks.html -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  auth.onAuthStateChanged(user => {
    if (!user) {
      // if user is not logged in, send them to login.html
      window.location = 'login.html';
    }
  });
</script>
  <script>
    // Initialize Firebase (same config)
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      // …other config…
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // If not signed in, redirect to login
    auth.onAuthStateChanged(user => {
      if (!user) {
        window.location = 'login.html';
      }
    });
  </script>

  <nav>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="tasks.html" class="active">Tasks</a>
      <a href="pomodoro.html">Pomodoro</a>
    </div>
    <div class="theme-controls">
      <label for="themeSelector">Theme:</label>
      <select id="themeSelector">
        <option value="light">Light</option>
        <option value="dark">Dark</option>
        <option value="ocean">Ocean</option>
        <option value="sunset">Sunset</option>
        <option value="midnight">Midnight</option>
      </select>
    </div>
    <div class="auth-controls">
      <button id="logoutBtn">Log out</button>
    </div>
  </nav>

  <div class="container">
    <!-- your existing new-task inputs and task list -->
    <div class="new-task">
      <input type="text" id="newTask" placeholder="Enter a new task…" />
      <input type="date" id="dueDate" />
      <input type="text" id="tags" placeholder="Tags (comma-separated)" />
      <button id="addBtn">Add Task</button>
    </div>
    <ul id="list"></ul>
  </div>

  <!-- Modal popup markup unchanged… -->
  <div id="overlay" class="hidden">
    <div id="taskModal" class="modal-popup">
      <h2 id="modalName">Task Name</h2>
      <div id="modalTimer">00:00</div>
      <div class="modal-controls">
        <button id="pauseBtn">Pause</button>
        <button id="resumeBtn">Resume</button>
        <button id="closeBtn">Close</button>
      </div>
    </div>
  </div>

  <script src="tasks.js"></script>
  <script>
    // Log out button
    document.getElementById('logoutBtn').onclick = () => auth.signOut().then(() => {
      window.location = 'login.html';
    });
  </script>
</body>
</html>
