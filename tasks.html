<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YeolPumta+ Tasks</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="tasks.html" class="active">Tasks</a>
    <a href="pomodoro.html">Pomodoro</a>
  </nav>
  <div class="container">
    <section class="new-task">
      <input type="text" id="newTask" placeholder="Enter a new task…" />
      <button id="addTaskBtn" class="btn-primary">Add Task</button>
    </section>
    <ul id="tasksList"></ul>
  </div>

  <!-- DARK OVERLAY + MODAL -->
  <div id="overlay" class="hidden">
    <div id="taskModal">
      <h3 id="modalTaskName">Task Name</h3>
      <div id="modalTimer">00:00</div>
      <div class="modal-buttons">
        <button id="modalPause" class="btn-secondary">Pause</button>
        <button id="modalClose" class="btn-secondary">Close</button>
      </div>
    </div>
  </div>

  <script src="tasks.js"></script>
</body>
</html>
